<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/icon.png' | relative_url }}">
  <style>
    /* The app's own look: deep ink, light type, a quiet gold for links. */
    :root {
      --ground: #0a0e1a;
      --ink: #eef0f5;
      --muted: #a7adbd;
      --accent: #e9c46a;
      --rule: rgba(255, 255, 255, 0.12);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --ground: #f7f6f2;
        --ink: #141824;
        --muted: #5b6070;
        --accent: #8a5a00;
        --rule: rgba(0, 0, 0, 0.1);
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font: 18px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overflow-wrap: break-word;
    }
    main { max-width: 700px; margin: 0 auto; padding: 32px 16px 64px; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
    header img { width: 64px; height: 64px; border-radius: 14px; }
    header a { color: inherit; text-decoration: none; font-size: 28px; font-weight: 300; letter-spacing: -0.5px; }
    h1 { font-size: 40px; font-weight: 300; letter-spacing: -0.8px; line-height: 1.15; margin: 28px 0 12px; }
    h2 { font-size: 23px; font-weight: 600; line-height: 1.3; margin: 36px 0 8px; }
    p, ul, ol { margin: 0 0 18px; }
    ul { padding-left: 22px; }
    li { margin: 0 0 8px; }
    a { color: var(--accent); }
    .lead { font-size: 20px; }
    .small, footer { color: var(--muted); font-size: 15px; }
    footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--rule); }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="{{ '/' | relative_url }}"><img src="{{ '/icon.png' | relative_url }}" alt=""></a>
      <a href="{{ '/' | relative_url }}">Boxset</a>
    </header>
    {{ content }}
    <footer>
      <a href="{{ '/' | relative_url }}">Boxset</a> · <a href="{{ '/support' | relative_url }}">Support</a> · <a href="{{ '/privacy' | relative_url }}">Privacy</a> · © 2026 Sam Ayers<br>
      Boxset is not affiliated with or endorsed by Plex, Inc. Plex is a trademark of Plex, Inc.
    </footer>
  </main>
</body>
</html>
